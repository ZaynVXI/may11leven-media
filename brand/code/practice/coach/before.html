<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Coach seats before</title>
<style>
@font-face{font-family:H;src:url(../../../fonts/library/hankengrotesk/HankenGrotesk[wght].ttf)}
body{margin:0;width:1080px;height:1350px;background:linear-gradient(160deg,#1d2b64,#7b3fa0);font-family:H,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center}
.card{width:820px;padding:56px;border-radius:40px;background:rgba(255,255,255,.12);box-shadow:0 30px 80px rgba(0,0,0,.45);backdrop-filter:blur(20px)}
.k{letter-spacing:.2em;text-transform:uppercase;font-size:18px;opacity:.7}
h1{font-size:64px;font-weight:800;margin:12px 0 32px;background:linear-gradient(90deg,#fff,#f6a);-webkit-background-clip:text;color:transparent}
select,.row{width:100%;font-size:26px;padding:22px;border-radius:20px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;margin-bottom:18px;box-sizing:border-box}
.row{display:flex;justify-content:space-between}
button{width:100%;font-size:30px;font-weight:800;padding:28px;border:0;border-radius:24px;background:linear-gradient(90deg,#ff7a59,#ff3d9a);color:#fff;margin-top:24px;box-shadow:0 20px 50px rgba(255,61,154,.5)}
p{opacity:.6;font-size:18px}
</style></head><body>
<div class="card">
<div class="k">🚆 Smart travel</div>
<h1>Book your seamless journey</h1>
<select><option>Economy class</option></select>
<select><option>Passengers: 4</option></select>
<div class="row"><span>Seat 1</span><span>Auto-assigned</span></div>
<div class="row"><span>Seat 2</span><span>Auto-assigned</span></div>
<div class="row"><span>Seat 3</span><span>Auto-assigned</span></div>
<div class="row"><span>Seat 4</span><span>Auto-assigned</span></div>
<button>Book now →</button>
<p>By continuing you agree to the terms.</p>
</div></body></html>
