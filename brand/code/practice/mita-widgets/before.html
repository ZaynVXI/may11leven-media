<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mita widgets (concept), first draft</title>
<style>
@font-face{font-family:Archivo;src:url(../../../fonts/Archivo.ttf);font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:Plex;src:url(../../../fonts/PlexMono.ttf)}
:root{--ground:#16171A;--tile:#232428;--ink:#F2F2EE;--muted:#8A8B86;--lcd:#C5D17E}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;background:linear-gradient(160deg,#2a2d3a,#0f1013);font-family:Archivo,sans-serif;color:var(--ink);position:relative}
.grid{position:absolute;left:90px;top:200px;display:grid;grid-template-columns:420px 420px;gap:60px}
.w{background:var(--tile);border-radius:44px;padding:40px;height:420px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.wide{grid-column:span 2;height:420px}
h1{position:absolute;left:90px;top:90px;font-weight:700;font-size:56px}
.big{font-weight:800;font-size:150px;line-height:1;color:var(--lcd)}
.s{font-size:44px;line-height:1.3;color:var(--muted)} .s b{color:var(--ink);font-weight:700}
.lab{font:400 22px Plex;color:var(--muted);margin-bottom:18px}
.bar{display:flex;height:40px;border-radius:20px;overflow:hidden;margin-top:30px}
.btn{margin-top:36px;background:var(--lcd);color:#111;border-radius:30px;padding:18px 0;text-align:center;font-weight:700;font-size:28px}
</style>
</head>
<body>
<h1>⚡ Mita Widgets</h1>
<div class="grid">
  <div class="w wide"><div class="lab">TONIGHT</div><p class="s">Good evening! You have <b>12.4 kWh</b> left, which is about <b>4 days</b> at your usual <b>3.1 kWh a day</b>. Top up by <b>Sunday</b> to stay on.</p></div>
  <div class="w"><div class="lab">UNITS LEFT</div><div class="big">12.4</div><div class="lab" style="margin-top:20px">kWh</div><div class="btn">Top up now →</div></div>
  <div class="w"><div class="lab">LAST TOKEN</div><div style="font-size:64px;font-weight:700">KES 1,000</div><div class="bar"><div style="flex:683;background:var(--lcd)"></div><div style="flex:317;background:#6b6c66"></div></div><div class="lab" style="margin-top:20px">Energy 683 · Taxes 317</div></div>
</div>
</body>
</html>
