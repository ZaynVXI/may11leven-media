<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
@font-face{font-family:G;font-weight:100 900;src:url(../../../brand/fonts/library/geist/Geist[wght].ttf)}
@font-face{font-family:PM;src:url(../../../brand/fonts/PlexMono.ttf)}
:root{--ink:#F3F1EA;--paper:#EDE8D8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;font-family:G;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
#s{position:absolute;inset:0;background:#141518}
.lab{position:absolute;font:400 20px/1 PM;letter-spacing:.06em;text-transform:uppercase;color:rgba(243,241,234,.55)}
.tl{top:64px;left:72px}.tr{top:64px;right:72px}.bl{bottom:60px;left:72px}.br{bottom:60px;right:72px}
/* the card morphs from a pill (Form 2 summary) to the full card and back */
#card{position:absolute;left:50%;top:50%;overflow:hidden;color:var(--ink);background:radial-gradient(120% 90% at 85% 0%,#B4435A,#7E2433 55%,#4A1420)}
#card::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(transparent 0 39px,rgba(255,255,255,.07) 39px 40px)}
.L{position:absolute;inset:0}
#pill{display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font:500 30px G;white-space:nowrap}
#pill span:last-child{font:400 20px PM;letter-spacing:.06em;color:rgba(243,241,234,.75)}
#full{padding:36px}
.cl{position:relative;display:flex;justify-content:space-between;font:400 19px PM;letter-spacing:.06em;text-transform:uppercase;color:rgba(243,241,234,.72)}
.amt{position:relative;margin-top:84px;display:flex;align-items:baseline;gap:14px;font:500 110px/1 G;letter-spacing:-.045em}
.amt small{font:500 30px G;letter-spacing:0;color:rgba(243,241,234,.75)}
.dg{position:relative;display:inline-block;height:110px;overflow:hidden}
.dg span{display:block;height:110px}
.sub{position:relative;margin-top:16px;font:400 26px G;color:rgba(243,241,234,.8)}
.track{position:relative;margin-top:44px;height:5px;border-radius:3px;background:rgba(243,241,234,.18)}
.track b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink)}
.track i{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--ink)}
.chip{position:relative;display:inline-flex;align-items:center;gap:12px;margin-top:40px;font:500 19px PM;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:13px 20px 13px 16px;background:rgba(243,241,234,.14)}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px rgba(243,241,234,.18)}
#nt{position:absolute;left:50%;width:560px;margin-left:-280px;background:#2A2C31;border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:12px 28px 12px 12px;display:flex;align-items:center;gap:16px;color:var(--ink);box-shadow:0 24px 50px rgba(0,0,0,.45)}
#nt .ic{width:58px;height:58px;border-radius:50%;background:#2F8A55;display:flex;align-items:center;justify-content:center;font:600 18px G}
#nt b{font:600 26px G}#nt span{font:400 20px G;color:#C9C6BE;margin-left:auto}
#plus{position:absolute;font:500 34px G;color:var(--ink)}
</style></head><body><div id="s">
<div class="lab tl">Friday 18:00 · It saves</div><div class="lab tr">Concept · Term</div>
<div id="nt"><div class="ic">M</div><b>KES 750</b><span>from M-Pesa</span></div>
<div id="card">
  <div class="L" id="pill"><span>Form 2</span><span>On track</span></div>
  <div class="L" id="full">
    <div class="cl"><span>Form 2 · Term 1</span><span>Locked for school</span></div>
    <div class="amt"><small>KES</small><span class="dg"><span id="a0">21,550</span><span id="a1">22,300</span></span></div>
    <div class="sub" id="sub">of 27,500 · KES 5,950 to go</div>
    <div class="track"><b id="tb"></b><i id="ti"></i></div>
    <div class="chip"><i></i><span id="fr">On track · 8 Fridays left</span></div>
  </div>
</div>
<div id="plus">+ 750</div>
<div class="lab bl">May11Leven Labs</div><div class="lab br">05 / 08</div>
</div>
<script>
const cl=x=>Math.max(0,Math.min(1,x)),io=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},eo=x=>1-Math.pow(1-cl(x),3),lerp=(a,b,p)=>a+(b-a)*p;
const $=id=>document.getElementById(id),D=7.2,P={w:520,h:100,r:50},C={w:760,h:480,r:48};
function render(t){
  t=((t%D)+D)%D;
  // 0-0.5 pill, 0.5-1.2 opens, 1.4 M-Pesa pill drops, 2.1-2.6 it merges into the card and the amount rolls,
  // 2.8 chip counts down, 3.2-3.9 "+750" floats, 5.6-6.3 card folds back to the pill, hold to 7.2
  const op=io((t-.5)/.7), fold=io((t-5.6)/.7), k=op*(1-fold);
  const w=lerp(P.w,C.w,k),h=lerp(P.h,C.h,k),r=lerp(P.r,C.r,k);
  Object.assign($('card').style,{width:w+'px',height:h+'px',marginLeft:-w/2+'px',marginTop:-h/2+40+'px',borderRadius:r+'px',boxShadow:`0 30px 70px rgba(126,36,51,${.3+.15*k})`});
  $('pill').style.opacity=1-cl(k*3); $('full').style.opacity=cl((k-.55)/.45);
  $('full').style.transform=`translateY(${(1-cl((k-.55)/.45))*14}px)`;
  // notification
  const nIn=eo((t-1.4)/.45), merge=io((t-2.1)/.5), n=nIn*(1-merge);
  const top=lerp(170,330,merge); $('nt').style.top=lerp(90,top,nIn)+'px'; $('nt').style.opacity=n; $('nt').style.transform=`scale(${1-.35*merge})`;
  // money lands
  const p=io((t-2.3)/.6);
  ['a0','a1'].forEach((id,i)=>{$(id).style.transform=`translateY(${-110*p}px)`;$(id).style.opacity=i?p:1-p;$(id).style.filter=`blur(${4*(i?1-p:p)}px)`});
  const pw=lerp(78.4,81.1,p); $('tb').style.width=pw+'%'; $('ti').style.left=pw+'%';
  $('sub').textContent=p<.5?'of 27,500 · KES 5,950 to go':'of 27,500 · KES 5,200 to go';
  const c=io((t-2.8)/.4); $('fr').textContent=c<.5?'On track · 8 Fridays left':'On track · 7 Fridays left'; $('fr').style.filter=`blur(${3*Math.sin(c*Math.PI)}px)`;
  const pu=Math.max(0,Math.sin(cl((t-2.9)/.9)*Math.PI)); $('ti').style.boxShadow=`0 0 0 ${6+14*pu}px rgba(243,241,234,${.22-.14*pu})`;
  // +750 floats from the amount
  const f=cl((t-3.2)/1.1); $('plus').style.opacity=Math.sin(f*Math.PI)*(t<5.6?1:0); $('plus').style.left='700px'; $('plus').style.top=(650-46*eo(f))+'px';
}
window.render=render;render(0);
</script></body></html>
