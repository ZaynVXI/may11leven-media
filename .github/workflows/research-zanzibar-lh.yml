name: research-zanzibar-lh
on:
  push:
    paths: ["research/zanzibar/run-lh.txt"]
permissions:
  contents: write
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: research/zanzibar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: ./lh3.sh
      - name: seal results (encrypted; only the studio key opens them) and commit
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          bash research/vault/seal.sh "research/zanzibar/out/lh3" "zanzibar-lh3-${{ github.run_id }}"
          git config user.name "research-bot"; git config user.email "research-bot@users.noreply.github.com"
          git add research/vault/*.enc && git commit -q -m "sealed results zanzibar-lh3" && git pull -q --rebase origin "${{ github.ref_name }}" && git push -q origin HEAD:"${{ github.ref_name }}" || echo "nothing"
