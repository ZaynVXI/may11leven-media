name: research-zanzibar
on:
  push:
    paths: ["research/zanzibar/run.txt"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: research/zanzibar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: list sites from OpenStreetMap
        run: mkdir -p out/shots && python3 overpass.py
      - name: phone audit
        run: |
          npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node audit.mjs
      - name: lighthouse
        run: ./lighthouse.sh
      - name: keep results private (short-lived artifact, never committed to this public repo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: research/zanzibar/out
          retention-days: 1
