name: fetch
on:
  push:
    paths: ["fetch/urls.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download each "name url" line into fetch/out/
        run: |
          mkdir -p fetch/out
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSL --max-time 120 -o "fetch/out/$name" "$url" || echo "failed $name"
          done < fetch/urls.txt
          ls -la fetch/out
      - name: commit
        run: |
          git config user.name "fetch-bot"; git config user.email "fetch-bot@users.noreply.github.com"
          git add fetch/out && git commit -m "fetched files" && git push || echo "nothing to commit"
