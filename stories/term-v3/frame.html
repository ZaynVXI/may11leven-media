<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
@font-face{font-family:IT;font-weight:300;src:url(../../brand/fonts/InterTight-Light.ttf)}

.lt .foot{color:rgba(20,18,19,.7)}

.post{position:absolute;left:180px;width:720px;height:900px;object-fit:cover;border-radius:28px;box-shadow:0 40px 100px rgba(0,0,0,.45)}
